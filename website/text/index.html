<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Send Text</title>
<style>
  :root { --bg:#fff; --ink:#1B1F2E; --muted:#6B7080; --line:#DDDFE4; --btn:#2D6A5F; --btn-ink:#fff; --alt:#F1F2F4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15171C; --ink:#ECEDF0; --muted:#A2A6B0; --line:#3A3E4A; --btn:#6FC2B0; --btn-ink:#15171C; --alt:#262932; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:0 0 6px; }
  textarea { width:100%; min-height:140px; font:inherit; font-size:17px; line-height:1.5; color:var(--ink); background:var(--bg);
             border:1px solid var(--line); border-radius:12px; padding:14px; margin:0 0 16px; resize:vertical; }
  a.btn { display:block; text-align:center; text-decoration:none; font-size:18px; font-weight:600; padding:16px; border-radius:12px; margin-bottom:10px; }
  .primary { background:var(--btn); color:var(--btn-ink); }
  .secondary { background:var(--alt); color:var(--ink); }
  .hint { color:var(--muted); font-size:14px; text-align:center; }
</style>
</head>
<body>
<main>
  <label for="body">Message (edit it if you like)</label>
  <textarea id="body"></textarea>
  <a class="btn primary" id="to-main" href="#" hidden></a>
  <a class="btn secondary" id="to-other" href="#">Text someone else</a>
  <p class="hint">Opens your Messages app with this text filled in. You tap Send.</p>
</main>
<script>
  // Data rides in the URL after "#", which browsers never send to the server.
  function decode(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  var data = { to: "", name: "", body: "" };
  try { data = decode(location.hash.slice(1)); } catch (e) {}
  var box = document.getElementById("body");
  box.value = data.body || "";
  var main = document.getElementById("to-main"), other = document.getElementById("to-other");
  // "?&body=" works on both iPhone and Android.
  function smsHref(to) { return "sms:" + (to || "") + "?&body=" + encodeURIComponent(box.value); }
  function refresh() {
    if (data.to) main.href = smsHref(data.to);
    other.href = smsHref("");
  }
  if (data.to) {
    main.hidden = false;
    main.textContent = "Text " + (data.name || data.to);
  } else {
    other.className = "btn primary";
    other.textContent = "Open Messages";
  }
  box.addEventListener("input", refresh);
  refresh();
</script>
</body>
</html>
