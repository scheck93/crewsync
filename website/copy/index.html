<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Copy Reply</title>
<style>
  :root { --bg:#fff; --ink:#1B1F2E; --muted:#6B7080; --line:#DDDFE4; --btn:#191E3B; --btn-ink:#fff; --ok:#2D6A5F; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15171C; --ink:#ECEDF0; --muted:#A2A6B0; --line:#3A3E4A; --btn:#E4E6EE; --btn-ink:#15171C; --ok:#6FC2B0; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px; }
  .text { white-space:pre-wrap; font-size:17px; line-height:1.5; border:1px solid var(--line); border-radius:12px; padding:16px; margin:0 0 16px; }
  button { width:100%; font-size:18px; font-weight:600; padding:16px; border:0; border-radius:12px; background:var(--btn); color:var(--btn-ink); cursor:pointer; }
  .hint { color:var(--muted); font-size:14px; margin-top:12px; text-align:center; }
  .done { color:var(--ok); font-weight:600; }
</style>
</head>
<body>
<main>
  <div class="text" id="text"></div>
  <button id="copy">Copy reply</button>
  <p class="hint" id="hint">Then paste it into the Airbnb chat.</p>
</main>
<script>
  // The reply rides in the URL after "#", which browsers never send to the server.
  function decode(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  var text = "";
  try { text = decode(location.hash.slice(1)); } catch (e) { text = ""; }
  var box = document.getElementById("text"), hint = document.getElementById("hint");
  box.textContent = text || "Nothing to copy. Open this page from a CrewSync email.";
  document.getElementById("copy").onclick = function () {
    function ok() { hint.textContent = "Copied! Now paste it into the Airbnb chat."; hint.className = "hint done"; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); ok(); } catch (e) { hint.textContent = "Press and hold the text above to copy it."; }
      document.body.removeChild(ta);
    }
  };
</script>
</body>
</html>
